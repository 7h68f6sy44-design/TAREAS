<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis Trabajos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1d1d1b; --muted:#6b6a65; --line:#e4e1d8;
  --accent:#2f5d50; --accent-soft:#e3ece8;
  --p1:#c2412d; --p2:#d98a1c; --p3:#3d7a9b; --p4:#7a8a6b;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#141412;--card:#1e1e1b;--ink:#eeece6;--muted:#9c9a92;--line:#2f2e2a;--accent:#7fbfa8;--accent-soft:#22302b}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
header{padding:20px 16px 8px;max-width:820px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:Fraunces,serif;font-size:26px;margin:0}
h2{font-family:Fraunces,serif;font-size:20px;margin:0 0 12px}
main{max-width:820px;margin:auto;padding:8px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
label{display:block;font-weight:500;margin:10px 0 6px}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:70px;resize:vertical}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:var(--accent);color:#fff;font-weight:600}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:wait}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:140px}
.muted{color:var(--muted);font-size:13px}
.tarea{display:flex;gap:12px;align-items:center;cursor:pointer;transition:transform .1s}
.tarea:active{transform:scale(.99)}
.rank{font-family:Fraunces,serif;font-size:22px;width:30px;text-align:center;color:var(--muted)}
.tarea .info{flex:1;min-width:0}
.tarea .titulo{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--ink)}
.prio{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;color:#fff;white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:8px}
.bar>div{height:100%;background:var(--accent)}
.fase h3{font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 0 8px}
.paso{display:flex;gap:10px;padding:10px;border-radius:10px;align-items:flex-start}
.paso.actual{background:var(--accent-soft)}
.paso input{width:20px;height:20px;margin-top:2px;flex:none}
.paso.hecho .accion{text-decoration:line-through;color:var(--muted)}
.paso .detalle{font-size:13px;color:var(--muted)}
.foco{text-align:center;padding:28px 16px}
.foco .accion{font-family:Fraunces,serif;font-size:22px;margin:10px 0}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.error{color:var(--p1);margin-top:10px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #fff;border-right-color:transparent;border-radius:50%;animation:g .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes g{to{transform:rotate(360deg)}}
.hidden{display:none}
</style>
</head>
<body>
<header>
  <h1 id="tituloApp">Mis trabajos</h1>
  <button id="btnNuevo">+ Nuevo</button>
</header>

<main>
  <section id="vistaNuevo" class="hidden">
    <div class="card">
      <h2>Añadir trabajo</h2>
      <label for="archivo">Archivo del trabajo (PDF, Word, TXT)</label>
      <input type="file" id="archivo" accept=".pdf,.docx,.txt,.md">
      <label for="texto">…o pega el enunciado</label>
      <textarea id="texto" placeholder="Opcional si subes archivo"></textarea>
      <label for="fecha">Fecha de entrega</label>
      <input type="date" id="fecha">
      <label for="notas">Notas (opcional)</label>
      <textarea id="notas" placeholder="Ej.: es en grupo, ya tengo la bibliografía…"></textarea>
      <div class="row" style="margin-top:14px">
        <button class="ghost" id="btnCancelar">Cancelar</button>
        <button id="btnAnalizar">Analizar con IA</button>
      </div>
      <div id="errorForm" class="error"></div>
    </div>
  </section>

  <section id="vistaLista">
    <div class="card">
      <div class="row" style="align-items:center">
        <div class="muted">Horas que puedes dedicar al día</div>
        <input type="number" id="horasDia" min="0.5" step="0.5" style="max-width:100px">
      </div>
    </div>
    <div id="lista"></div>
  </section>

  <section id="vistaDetalle" class="hidden">
    <button class="ghost" id="btnVolver" style="margin-bottom:12px">← Volver</button>
    <div id="detalle"></div>
  </section>
</main>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const $ = (id) => document.getElementById(id);
const CLAVE = "trabajos-v1";
let trabajos = cargar();
let horasDia = Number(localStorage.getItem("horasDia")) || 3;
$("horasDia").value = horasDia;

function cargar(){ try { return JSON.parse(localStorage.getItem(CLAVE)) || []; } catch { return []; } }
function guardar(){ try { localStorage.setItem(CLAVE, JSON.stringify(trabajos)); } catch {} }

function mostrar(vista){
  ["vistaNuevo","vistaLista","vistaDetalle"].forEach(v => $(v).classList.toggle("hidden", v !== vista));
  $("btnNuevo").classList.toggle("hidden", vista !== "vistaLista");
  window.scrollTo(0,0);
}
$("btnNuevo").onclick = () => { $("errorForm").textContent=""; mostrar("vistaNuevo"); };
$("btnCancelar").onclick = () => mostrar("vistaLista");
$("btnVolver").onclick = () => { pintarLista(); mostrar("vistaLista"); };
$("horasDia").onchange = (e) => { horasDia = Math.max(0.5, Number(e.target.value)||3); localStorage.setItem("horasDia", horasDia); pintarLista(); };

async function leerArchivo(file){
  const ext = file.name.split(".").pop().toLowerCase();
  if (ext === "pdf"){
    const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
    let txt = "";
    for (let i = 1; i <= pdf.numPages; i++){
      const page = await pdf.getPage(i);
      const c = await page.getTextContent();
      txt += c.items.map(it => it.str).join(" ") + "\n";
    }
    return txt;
  }
  if (ext === "docx"){
    const r = await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
    return r.value;
  }
  return await file.text();
}

$("btnAnalizar").onclick = async () => {
  const btn = $("btnAnalizar"), err = $("errorForm");
  err.textContent = "";
  const file = $("archivo").files[0];
  const fecha = $("fecha").value;
  if (!fecha) return err.textContent = "Pon la fecha de entrega.";
  if (!file && !$("texto").value.trim()) return err.textContent = "Sube un archivo o pega el enunciado.";

  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Analizando…';
  try {
    let contenido = $("texto").value.trim();
    if (file) contenido = (await leerArchivo(file)) + (contenido ? "\n\n" + contenido : "");
    if (contenido.trim().length < 20) throw new Error("No he podido leer texto del archivo (¿es un PDF escaneado?). Pega el enunciado a mano.");

    const res = await fetch("/api/analizar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ contenido, fechaEntrega: fecha, nombreArchivo: file?.name, notas: $("notas").value })
    });
    const bruto = await res.text();
    let data;
    try { data = JSON.parse(bruto); }
    catch { throw new Error(`El servidor respondió con error ${res.status}` + (res.status >= 500 ? " (probablemente la IA tardó demasiado). Inténtalo de nuevo." : ". ¿Está desplegada la función?")); }
    if (!res.ok) throw new Error(data.error || "Error del servidor");

    const pasos = [];
    data.fases.forEach((f, fi) => f.pasos.forEach(p => pasos.push({ ...p, fase: fi, hecho: false })));
    trabajos.push({
      id: crypto.randomUUID(), creado: Date.now(), fechaEntrega: fecha, archivo: file?.name || "Texto pegado",
      titulo: data.titulo, asignatura: data.asignatura, resumen: data.resumen,
      horasEstimadas: data.horasEstimadas, dificultad: data.dificultad, justificacion: data.justificacion,
      fases: data.fases.map(f => f.nombre), pasos
    });
    guardar();
    ["archivo","texto","fecha","notas"].forEach(id => $(id).value = "");
    pintarLista(); mostrar("vistaLista");
  } catch (e){
    err.textContent = e.message;
  } finally {
    btn.disabled = false; btn.textContent = "Analizar con IA";
  }
};

function diasRestantes(fecha){
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  return Math.round((new Date(fecha + "T00:00:00") - hoy) / 86400000);
}
function horasPendientes(t){
  const total = t.pasos.reduce((s,p) => s + (p.minutos||10), 0);
  const pend = t.pasos.filter(p => !p.hecho).reduce((s,p) => s + (p.minutos||10), 0);
  return total ? t.horasEstimadas * pend / total : t.horasEstimadas;
}
function prioridad(t){
  const dias = Math.max(diasRestantes(t.fechaEntrega), 0.5);
  const horas = horasPendientes(t);
  const presion = horas / (dias * horasDia);
  const urgencia = 10 / (dias + 1);
  const carga = t.dificultad / 5;
  return presion * 6 + urgencia * 2 + carga * 2;
}
function etiqueta(score){
  if (score >= 6) return ["Urgente","var(--p1)"];
  if (score >= 3.5) return ["Alta","var(--p2)"];
  if (score >= 1.8) return ["Media","var(--p3)"];
  return ["Baja","var(--p4)"];
}
const puntos = (n) => "●".repeat(n) + "○".repeat(5-n);
const textoDias = (d) => d < 0 ? `Vencido hace ${-d} d` : d === 0 ? "Entrega hoy" : d === 1 ? "Mañana" : `En ${d} días`;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function pintarLista(){
  const pendientes = trabajos.filter(t => t.pasos.some(p => !p.hecho));
  const terminados = trabajos.filter(t => t.pasos.length && t.pasos.every(p => p.hecho));
  pendientes.sort((a,b) => prioridad(b) - prioridad(a));

  if (!trabajos.length){
    $("lista").innerHTML = `<div class="empty">Aún no tienes trabajos.<br>Pulsa <b>+ Nuevo</b> y sube el primero.</div>`;
    return;
  }
  const tarjeta = (t, i, fin) => {
    const [txt, color] = fin ? ["Hecho","var(--p4)"] : etiqueta(prioridad(t));
    const hechos = t.pasos.filter(p => p.hecho).length;
    return `<div class="card tarea" data-id="${t.id}">
      <div class="rank">${fin ? "✓" : i+1}</div>
      <div class="info">
        <div class="titulo">${esc(t.titulo)}</div>
        <div class="muted">${esc(t.asignatura)} · ${textoDias(diasRestantes(t.fechaEntrega))}</div>
        <div class="chips">
          <span class="chip">⏱ ${horasPendientes(t).toFixed(1)} h</span>
          <span class="chip">🧠 ${puntos(t.dificultad)}</span>
        </div>
        <div class="bar"><div style="width:${t.pasos.length ? hechos/t.pasos.length*100 : 0}%"></div></div>
      </div>
      <span class="prio" style="background:${color}">${txt}</span>
    </div>`;
  };
  $("lista").innerHTML = pendientes.map((t,i) => tarjeta(t,i,false)).join("") +
    (terminados.length ? `<h2 style="margin-top:24px">Terminados</h2>` + terminados.map(t => tarjeta(t,0,true)).join("") : "");
  document.querySelectorAll(".tarea").forEach(el => el.onclick = () => abrir(el.dataset.id));
}

let actualId = null;
function abrir(id){ actualId = id; pintarDetalle(); mostrar("vistaDetalle"); }

function pintarDetalle(){
  const t = trabajos.find(x => x.id === actualId);
  if (!t) return;
  const idxActual = t.pasos.findIndex(p => !p.hecho);
  const sig = t.pasos[idxActual];
  const hechos = t.pasos.filter(p => p.hecho).length;

  let html = `<div class="card">
      <h2>${esc(t.titulo)}</h2>
      <div class="muted">${esc(t.asignatura)} · Entrega ${new Date(t.fechaEntrega+"T00:00:00").toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"})}</div>
      <p>${esc(t.resumen)}</p>
      <div class="chips">
        <span class="chip">⏱ ${t.horasEstimadas} h estimadas</span>
        <span class="chip">🧠 Dificultad ${t.dificultad}/5</span>
        <span class="chip">📄 ${esc(t.archivo)}</span>
      </div>
      <p class="muted">${esc(t.justificacion)}</p>
      <div class="bar"><div style="width:${hechos/t.pasos.length*100}%"></div></div>
      <div class="muted" style="margin-top:4px">${hechos} de ${t.pasos.length} pasos</div>
    </div>`;

  html += sig
    ? `<div class="card foco">
        <div class="muted">Siguiente micro acción · ${sig.minutos} min</div>
        <div class="accion">${esc(sig.accion)}</div>
        <div class="muted">${esc(sig.detalle)}</div>
        <button style="margin-top:16px" id="btnHecho">✓ Hecho, siguiente</button>
      </div>`
    : `<div class="card foco"><div class="accion">🎉 ¡Trabajo terminado!</div></div>`;

  html += `<div class="card">`;
  t.fases.forEach((nombre, fi) => {
    html += `<div class="fase"><h3>${esc(nombre)}</h3>`;
    t.pasos.forEach((p, pi) => {
      if (p.fase !== fi) return;
      html += `<label class="paso ${p.hecho ? "hecho" : ""} ${pi === idxActual ? "actual" : ""}">
          <input type="checkbox" data-i="${pi}" ${p.hecho ? "checked" : ""}>
          <div><div class="accion">${esc(p.accion)}</div><div class="detalle">${esc(p.detalle)} · ${p.minutos} min</div></div>
        </label>`;
    });
    html += `</div>`;
  });
  html += `</div><button class="ghost" id="btnBorrar" style="width:100%">Eliminar trabajo</button>`;

  $("detalle").innerHTML = html;
  if (sig) $("btnHecho").onclick = () => { sig.hecho = true; guardar(); pintarDetalle(); };
  $("detalle").querySelectorAll("input[type=checkbox]").forEach(cb =>
    cb.onchange = () => { t.pasos[cb.dataset.i].hecho = cb.checked; guardar(); pintarDetalle(); });
  $("btnBorrar").onclick = () => {
    if (!confirm("¿Eliminar este trabajo?")) return;
    trabajos = trabajos.filter(x => x.id !== t.id); guardar(); pintarLista(); mostrar("vistaLista");
  };
}

pintarLista();
</script>
</body>
</html>
